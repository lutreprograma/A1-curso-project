/* ========================= */
/* MAPA INTERACTIVO */

}

/* ZONAS CLICKEABLES */

.zona{
    position:absolute;
    cursor:pointer;
    border-radius:12px;
    transition:0.2s;

    border:2px solid red;
    background:rgba(255,0,0,0.2);
}

/* HOVER */

.zona:hover{
    background:rgba(0,255,0,0.35);
    border:2px solid lime;
}

/* AUDIO ACTIVO */

.zona.activa{
    background:rgba(255,255,255,0.2);
    box-shadow:
    0 0 20px rgba(255,255,255,0.9),
    0 0 40px rgba(255,255,255,0.6);

    animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.03);
}

100%{
transform:scale(1);
}

}

/* ========================= */
/* MÓVIL */
/* ========================= */

@media(max-width:700px){

.mapa-container{
    border-radius:15px;
    overflow:hidden;
}

}

<script>

/* ========================= */
/* AUDIO SIMPLE */
/* ========================= */

function playAudio(id){

document.getElementById(id).currentTime = 0;
document.getElementById(id).play();

}

/* ========================= */
/* TOGGLE EXPLICACIÓN */
/* ========================= */

function toggleAudio(id){

const audio = document.getElementById(id);

if(!audio.paused){

audio.pause();
audio.currentTime = 0;

}else{

audio.currentTime = 0;
audio.play();

}

}

/* ========================= */
/* ZONAS INTERACTIVAS */
/* ========================= */

let audioActual = null;
let zonaActual = null;

function playZona(id, elemento){

const audio =
document.getElementById(id);

/* SI ES EL MISMO AUDIO */

if(audioActual === audio && !audio.paused){

audio.pause();
audio.currentTime = 0;

elemento.classList.remove("activa");

audioActual = null;
zonaActual = null;

return;

}

/* PARAR AUDIO ANTERIOR */

if(audioActual){

audioActual.pause();
audioActual.currentTime = 0;

}

if(zonaActual){

zonaActual.classList.remove("activa");

}

/* NUEVO AUDIO */

audio.currentTime = 0;
audio.play();

elemento.classList.add("activa");

audioActual = audio;
zonaActual = elemento;

/* QUITAR EFECTO AL TERMINAR */

audio.onended = ()=>{

elemento.classList.remove("activa");

audioActual = null;
zonaActual = null;

};

}

</script>
