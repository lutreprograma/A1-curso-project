/* ========================= */
/* EJERCICIOS PRONOMBRES */
/* ========================= */

.grid-pronombres{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:25px;
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

.ejercicio-pronombre{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* IMAGEN OCULTA */

.pronombre-pregunta{
    width:110px;
    height:110px;

    background:#8ecae6;

    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:50px;
    font-weight:bold;
    color:white;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
    inset -8px -8px 0 rgba(0,0,0,0.15),
    inset 5px 5px 0 rgba(255,255,255,0.2);

    transition:0.2s;
}

.pronombre-pregunta:hover{
    transform:scale(1.05);
}

.pronombre-pregunta img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ESTADOS */

.pronombre-correcto{
    background:#2ecc71 !important;
}

.pronombre-incorrecto{
    background:#e74c3c !important;
}

/* OPCIONES */

.opciones{
    display:flex;
    gap:10px;
    margin-top:15px;
    justify-content:center;
}

.opcion-img{
    width:65px;
    height:65px;

    border-radius:15px;

    object-fit:cover;

    cursor:pointer;

    border:4px solid white;

    transition:0.2s;
}

.opcion-img:hover{
    transform:scale(1.05);
}

.correcto{
    border:4px solid #2ecc71 !important;
}

.incorrecto{
    border:4px solid #e74c3c !important;
}

/* MÓVIL */

@media(max-width:700px){

    .grid-pronombres{
        grid-template-columns: repeat(2, 1fr);
        gap:20px 10px;
    }

    .pronombre-pregunta{
        width:90px;
        height:90px;
    }

    .opcion-img{
        width:55px;
        height:55px;
    }

}

<script>
    
/* AUDIO INSTRUCCIÓN */

function playAudio(id){
    document.getElementById(id).play();
}
    
/* AUDIO */

function playPronombre(numero){
    document.getElementById("audio-" + numero).play();
}

/* VALIDACIÓN */

function checkPronombre(opcion, correcta, preguntaId, elemento){

    let pregunta =
    document.getElementById(preguntaId);

    if(opcion === correcta){

        pregunta.innerHTML =
        `<img src="img/${correcta}.png">`;

        pregunta.classList.remove("pronombre-incorrecto");
        pregunta.classList.add("pronombre-correcto");

        elemento.classList.remove("incorrecto");
        elemento.classList.add("correcto");

    } else {

        elemento.classList.remove("correcto");
        elemento.classList.add("incorrecto");

        pregunta.classList.add("pronombre-incorrecto");

    }

}

</script>
