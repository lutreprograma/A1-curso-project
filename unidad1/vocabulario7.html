<script>

let audioActual = null;

/* AUDIO INSTRUCCIÓN */
function playAudio(id){

const audio = document.getElementById(id);

audio.currentTime = 0;
audio.play();

}

/* TOGGLE AUDIO */
function toggleAudio(id){

const audio = document.getElementById(id);

/* MISMO AUDIO = DETENER */

if(audioActual === audio && !audio.paused){

audio.pause();
audio.currentTime = 0;
audioActual = null;

return;

}

/* DETENER OTRO AUDIO */

if(audioActual){

audioActual.pause();
audioActual.currentTime = 0;

}

/* REPRODUCIR NUEVO */

audio.play();

audioActual = audio;

/* LIMPIAR CUANDO TERMINE */

audio.onended = ()=>{

audioActual = null;

};

}

</script>
