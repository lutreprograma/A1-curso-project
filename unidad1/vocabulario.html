<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unidad 1 - El abecedario</title>

<link rel="stylesheet" href="../style.css">
</head>

<body>

<h1>El abecedario</h1>

<div class="instruccion">
    <p>Escucha las letras del alfabeto y repite.</p>

   <div class="banderas">
    <div class="flag" onclick="playAudio('es')">
        <img src="img/es.png">
        <span>🔊</span>
    </div>

    <div class="flag" onclick="playAudio('en')">
        <img src="img/en.png">
        <span>🔊</span>
    </div>

    <div class="flag" onclick="playAudio('fr')">
        <img src="img/fr.png">
        <span>🔊</span>
    </div>

    <div class="flag" onclick="playAudio('ru')">
        <img src="img/ru.avif">
        <span>🔊</span>
    </div>
</div>

<div class="imagen-grande">
    <img src="img/alfabeto.png" alt="Abecedario">
</div>

<!-- AUDIO INSTRUCCIONES (OCULTOS) -->
<audio id="es" src="audio/instruccion_1_es.mp3"></audio>
<audio id="en" src="audio/instruccion_1_en.mp3"></audio>
<audio id="fr" src="audio/instruccion_1_fr.mp3"></audio>
<audio id="ru" src="audio/instruccion_1_ru.mp3"></audio>

<!-- AUDIO PRINCIPAL (VISIBLE) -->
<div class="audio-principal">
    <audio controls>
        <source src="audio/alfabeto_es.mp3" type="audio/mpeg">
    </audio>
</div>

<script src="../script.js"></script>

</body>
</html>
