<style>

/* ========================= */
/* ACTIVIDAD RELOJ */
/* ========================= */

.reloj-container{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    gap:60px;
    margin:50px auto;
    flex-wrap:wrap;
}

.reloj{
    cursor:pointer;
    position:relative;
    width:320px;
    height:320px;
    border:10px solid #ddd;
    border-radius:50%;
    background:white;
    box-shadow:0 0 20px rgba(0,0,0,0.2);

    user-select:none;
    -webkit-user-select:none;
}

.numero-reloj{
    position:absolute;
    width:100%;
    height:100%;
    font-size:32px;
    font-weight:bold;
    color:black;
}

.numero-reloj span{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:center center;
}

/* POSICIONES */

.n1 span{ transform: rotate(30deg) translate(0,-135px) rotate(-30deg);}
.n2 span{ transform: rotate(60deg) translate(0,-135px) rotate(-60deg);}
.n3 span{ transform: rotate(90deg) translate(0,-135px) rotate(-90deg);}
.n4 span{ transform: rotate(120deg) translate(0,-135px) rotate(-120deg);}
.n5 span{ transform: rotate(150deg) translate(0,-135px) rotate(-150deg);}
.n6 span{ transform: rotate(180deg) translate(0,-135px) rotate(-180deg);}
.n7 span{ transform: rotate(210deg) translate(0,-135px) rotate(-210deg);}
.n8 span{ transform: rotate(240deg) translate(0,-135px) rotate(-240deg);}
.n9 span{ transform: rotate(270deg) translate(0,-135px) rotate(-270deg);}
.n10 span{ transform: rotate(300deg) translate(0,-135px) rotate(-300deg);}
.n11 span{ transform: rotate(330deg) translate(0,-135px) rotate(-330deg);}
.n12 span{ transform: translate(0,-135px);}

/* AGUJAS */

.aguja{
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin:bottom center;
    transform:translateX(-50%) rotate(0deg);
    border-radius:20px;
    z-index:5;
    touch-action:none;
}

/* HORA */

.hora{
    width:10px;
    height:85px;
    background:#2563eb;
    z-index:7;
}

/* MINUTO */

.minuto{
    width:6px;
    height:125px;
    background:#ef4444;
    z-index:6;
}

/* BOLITAS */

.punta{
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;
    cursor:pointer;
}

.hora-punta{
    width:20px;
    height:20px;
    background:#2563eb;
}

.minuto-punta{
    width:16px;
    height:16px;
    background:#ef4444;
}

/* CENTRO */

.centro{
    position:absolute;
    width:22px;
    height:22px;
    background:black;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:10;
}

/* PANEL DERECHO */

.panel-control{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.caja-resultado{
    width:160px;
    height:160px;

    background:#8ecae6;

    border-radius:30px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:55px;
    font-weight:bold;
    color:white;

    box-shadow:
    inset -8px -8px 0 rgba(0,0,0,0.15),
    inset 5px 5px 0 rgba(255,255,255,0.2);

    transition:0.3s;
}

.correcto{
    background:#2ecc71 !important;
}

.incorrecto{
    background:#e74c3c !important;
}


/* SHAKE */

.shake{
    animation:shake 0.4s;
}

@keyframes shake{
    0%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-8px); }
    80%{ transform:translateX(8px); }
    100%{ transform:translateX(0); }
}

/* TEXTO HORA */

.hora-digital{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

/* MÓVIL */

@media(max-width:700px){

.reloj{
    width:260px;
    height:260px;
}

.numero-reloj{
    font-size:24px;
}

.n1 span{ transform: rotate(30deg) translate(0,-110px) rotate(-30deg);}
.n2 span{ transform: rotate(60deg) translate(0,-110px) rotate(-60deg);}
.n3 span{ transform: rotate(90deg) translate(0,-110px) rotate(-90deg);}
.n4 span{ transform: rotate(120deg) translate(0,-110px) rotate(-120deg);}
.n5 span{ transform: rotate(150deg) translate(0,-110px) rotate(-150deg);}
.n6 span{ transform: rotate(180deg) translate(0,-110px) rotate(-180deg);}
.n7 span{ transform: rotate(210deg) translate(0,-110px) rotate(-210deg);}
.n8 span{ transform: rotate(240deg) translate(0,-110px) rotate(-240deg);}
.n9 span{ transform: rotate(270deg) translate(0,-110px) rotate(-270deg);}
.n10 span{ transform: rotate(300deg) translate(0,-110px) rotate(-300deg);}
.n11 span{ transform: rotate(330deg) translate(0,-110px) rotate(-330deg);}
.n12 span{ transform: translate(0,-110px);}

}

</style>

<audio id="hora8_7" src="audio/hora8_7.mp3"></audio>
<audio id="hora8_8" src="audio/hora8_8.mp3"></audio>
<audio id="hora8_9" src="audio/hora8_9.mp3"></audio>
<audio id="hora8_10" src="audio/hora8_10.mp3"></audio>
<audio id="hora8_11" src="audio/hora8_11.mp3"></audio>

<script>

function playAudio(id){
document.getElementById(id).play();
}

const ejercicios = [

{audio:"hora8_1", hora:1, minuto:0, digital:"01:00"},
{audio:"hora8_2", hora:2, minuto:0, digital:"02:00"},
{audio:"hora8_3", hora:12, minuto:0, digital:"12:00"},
{audio:"hora8_4", hora:3, minuto:30, digital:"03:30"},
{audio:"hora8_5", hora:3, minuto:45, digital:"03:45"},
{audio:"hora8_6", hora:11, minuto:50, digital:"11:50"},
{audio:"hora8_7", hora:11, minuto:30, digital:"11:30"},
{audio:"hora8_8", hora:2, minuto:30, digital:"02:30"},
{audio:"hora8_9", hora:12, minuto:30, digital:"12:30"},
{audio:"hora8_10", hora:9, minuto:50, digital:"09:50"},
{audio:"hora8_11", hora:4, minuto:45, digital:"04:45"}

];

let actual;
let anterior = null;

let horaUsuario = 12;
let minutoUsuario = 0;

const reloj =
document.getElementById("reloj");

let arrastrando = null;

/* DRAG AGUJAS */

document.getElementById("agujaHora")
.addEventListener("mousedown", ()=>{

arrastrando = "hora";

});

document.getElementById("agujaMinuto")
.addEventListener("mousedown", ()=>{

arrastrando = "minuto";

});

document.addEventListener("mouseup", ()=>{

arrastrando = null;

});

/* TOUCH */

document.getElementById("agujaHora")
.addEventListener("touchstart", (e)=>{
e.preventDefault();
arrastrando = "hora";

});

document.getElementById("agujaMinuto")
.addEventListener("touchstart", (e)=>{
e.preventDefault();
arrastrando = "minuto";

});

document.addEventListener("touchend", ()=>{

arrastrando = null;

});

/* MOVIMIENTO */

reloj.addEventListener("mousemove", moverAguja);

reloj.addEventListener("touchmove", moverAgujaTouch);

function moverAgujaTouch(e){

if(!arrastrando) return;

e.preventDefault();    
    
const touch = e.touches[0];

mover(touch.clientX, touch.clientY);

}

function moverAguja(e){

if(!arrastrando) return;

mover(e.clientX, e.clientY);

}

function mover(x,y){

const rect =
reloj.getBoundingClientRect();

const cx =
rect.left + rect.width/2;

const cy =
rect.top + rect.height/2;

const dx = x - cx;
const dy = y - cy;

let angulo =
Math.atan2(dy, dx) * 180 / Math.PI;

angulo += 90;

if(angulo < 0){
angulo += 360;
}

/* MINUTOS */

if(arrastrando === "minuto"){

let minuto =
Math.round(angulo / 30) * 5;

if(minuto >= 60){
minuto = 0;
}

minutoUsuario = minuto;

/* HORAS */

}else{

let hora =
Math.round(angulo / 30);

if(hora === 0){
hora = 12;
}

horaUsuario = hora;

}

actualizarReloj();

comprobarHora();

}    
    
function nuevoEjercicio(){

do{

actual =
ejercicios[Math.floor(Math.random()*ejercicios.length)];

}while(actual === anterior);

anterior = actual;

horaUsuario = 12;
minutoUsuario = 0;

actualizarReloj();

const caja =
document.getElementById("resultado");

caja.innerText = "?";
caja.className = "caja-resultado";

document.getElementById("horaDigital")
.innerText = "";

}

function playCurrentAudio(){

document.getElementById(actual.audio).play();

}

function actualizarReloj(){

let horaDeg =
(horaUsuario * 30) + (minutoUsuario * 0.5);

let minutoDeg =
minutoUsuario * 6;

document.getElementById("agujaHora")
.style.transform =
`translateX(-50%) rotate(${horaDeg}deg)`;

document.getElementById("agujaMinuto")
.style.transform =
`translateX(-50%) rotate(${minutoDeg}deg)`;

}



function comprobarHora(){

const caja =
document.getElementById("resultado");

if(
horaUsuario === actual.hora &&
minutoUsuario === actual.minuto
){

caja.classList.remove("incorrecto");
caja.classList.add("correcto");

caja.innerText =
actual.digital;

document.getElementById("horaDigital")
.innerText = "";

setTimeout(()=>{

nuevoEjercicio();

},1500);

}else{

caja.classList.remove("correcto");
caja.classList.add("incorrecto");
caja.classList.add("shake");

setTimeout(()=>{

caja.classList.remove("shake");
caja.classList.remove("incorrecto");
    
},400);

}

}

nuevoEjercicio();

</script>
